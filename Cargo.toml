[package]
name = "outis-recovery"
version = "1.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false
repository = "https://github.com/outis-wallet/recovery"
description = "Offline recovery of Outis wallet keys and account addresses"

[dependencies]
bip39 = { version = "2.2.2", features = ["zeroize"] }
crypto-bigint = { version = "0.5.5", features = ["zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
rpassword = "7.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
starknet-crypto = "0.8.1"
unicode-normalization = "0.1.25"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
